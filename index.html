<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebRTC P2P Demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
  textarea { width: 100%; height: 5rem; box-sizing: border-box; }
  #status { padding: .5rem; border-radius: 4px; background: #eef; }
  #status.error { background: #fdd; color: #900; }
  #log { border: 1px solid #ccc; height: 12rem; overflow-y: auto; padding: .5rem; margin-bottom: .5rem; }
  #msg-input { width: 75%; }
  button { padding: .4rem .8rem; }
</style>
</head>
<body>
<h1>WebRTC P2P Demo</h1>
<p id="status">Starting…</p>

<!-- Initiator view: share the link, then paste the peer's answer -->
<div id="offer-section" hidden>
  <p>Send this link to your peer:</p>
  <textarea id="offer-link" readonly></textarea>
  <p>Then paste the answer they send back:</p>
  <textarea id="answer-input" placeholder="Paste answer blob here"></textarea>
  <button id="connect-btn">Connect</button>
</div>

<!-- Responder view: send this answer blob back to the initiator -->
<div id="answer-section" hidden>
  <p>Send this blob back to the person who invited you:</p>
  <textarea id="answer-output" readonly></textarea>
</div>

<!-- Chat view: shown once the direct connection opens -->
<div id="chat-section" hidden>
  <div id="log"></div>
  <input id="msg-input" placeholder="Type a message">
  <button id="send-btn">Send</button>
</div>

<script>
// Grab the elements we interact with.
const status = document.getElementById("status");
const offerSection = document.getElementById("offer-section");
const answerSection = document.getElementById("answer-section");
const chatSection = document.getElementById("chat-section");
const log = document.getElementById("log");

// Show a message in the status line, red when it's an error.
function setStatus(msg, isError) {
  status.textContent = msg;
  status.classList.toggle("error", !!isError);
}

// Append a line to the chat log.
function addLine(text) {
  const line = document.createElement("div");
  line.textContent = text;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
}

// Catch-all: report any error we didn't handle explicitly instead of failing silently.
window.onunhandledrejection = (e) => setStatus("Unexpected error: " + (e.reason && e.reason.message || e.reason), true);
window.onerror = (msg) => setStatus("Unexpected error: " + msg, true);

// Stop early if the browser can't do WebRTC at all.
if (!("RTCPeerConnection" in window)) {
  setStatus("This browser does not support WebRTC.", true);
  throw new Error("WebRTC unsupported");
}

// Warn (non-fatal) if we are not on https/localhost, where WebRTC is often blocked.
if (!window.isSecureContext) {
  setStatus("Warning: not a secure context — serve this over https or localhost.", true);
}

// Public STUN server: lets each peer discover its own public (NAT-mapped) address for hole punching.
const config = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

// The data channel we send chat over, set once it exists.
let chatChannel;

// One connection object for this page.
const pc = new RTCPeerConnection(config);

// Encode an SDP description into a string for copy-paste.
const encode = (desc) => btoa(JSON.stringify(desc));

// Decode a pasted string back into an SDP description (throws on malformed input).
const decode = (str) => new RTCSessionDescription(JSON.parse(atob(str)));

// Wait until ICE gathering finishes so the SDP has every candidate, but give up after 5s so we never hang.
function waitForIce() {
  if (pc.iceGatheringState === "complete") return Promise.resolve();
  return new Promise((resolve) => {
    const timer = setTimeout(resolve, 5000);
    pc.addEventListener("icegatheringstatechange", () => {
      if (pc.iceGatheringState === "complete") { clearTimeout(timer); resolve(); }
    });
  });
}

// Warn if no public (srflx) candidate was gathered — STUN likely failed and cross-network won't work.
function warnIfNoPublicCandidate() {
  if (!pc.localDescription.sdp.includes("typ srflx")) {
    setStatus("Warning: no public address found (STUN unreachable?) — cross-network connection is unlikely.", true);
  }
}

// Wire up a data channel: reveal chat on open, and report its errors and closure.
function setupChannel(channel) {
  chatChannel = channel;
  channel.onopen = () => { chatSection.hidden = false; };
  channel.onmessage = (e) => addLine("Peer: " + e.data);
  channel.onerror = (e) => setStatus("Data channel error: " + (e.error && e.error.message || "unknown"), true);
  channel.onclose = () => setStatus("Data channel closed — peer disconnected.", true);
}

// Report connection lifecycle so a successful hole punch — or its failure — is visible.
pc.onconnectionstatechange = () => {
  const s = pc.connectionState;
  if (s === "failed") setStatus("Connection failed — hole punching did not work (peers may be behind symmetric NAT; this demo has no TURN relay).", true);
  else if (s === "disconnected") setStatus("Peer disconnected — connection lost.", true);
  else if (s === "closed") setStatus("Connection closed.", true);
  else setStatus("Connection: " + s);
};

// The offer, if present, rides in the URL hash — this decides which peer we are.
const remoteOffer = location.hash.slice(1);

if (!remoteOffer) {
  // Initiator: create the data channel, make an offer, and build a shareable link.
  setupChannel(pc.createDataChannel("chat"));
  offerSection.hidden = false;
  (async () => {
    try {
      await pc.setLocalDescription(await pc.createOffer());
      await waitForIce();
      warnIfNoPublicCandidate();
      // Bake the full offer into the link's hash so opening it starts the responder side.
      document.getElementById("offer-link").value =
        location.href.split("#")[0] + "#" + encode(pc.localDescription);
    } catch (err) {
      setStatus("Failed to create invite link: " + err.message, true);
    }
  })();

  // Finish the handshake when the initiator pastes the answer blob.
  const connectBtn = document.getElementById("connect-btn");
  connectBtn.onclick = async () => {
    const text = document.getElementById("answer-input").value.trim();
    // Guard against clicking Connect with nothing pasted.
    if (!text) { setStatus("Paste the answer blob first.", true); return; }
    let answer;
    // Parse the blob separately so a corrupt paste gives a clear message.
    try { answer = decode(text); } catch { setStatus("Invalid or corrupted answer blob.", true); return; }
    try {
      await pc.setRemoteDescription(answer);
      connectBtn.disabled = true;
    } catch (err) {
      // Wrong SDP or applying an answer twice / in the wrong state lands here.
      setStatus("Could not apply answer: " + err.message, true);
    }
  };
} else {
  // Responder: the initiator creates the channel, so just listen for it.
  pc.ondatachannel = (e) => setupChannel(e.channel);
  answerSection.hidden = false;
  (async () => {
    let offer;
    // Parse the invite link separately so a corrupt link gives a clear message.
    try { offer = decode(remoteOffer); } catch { setStatus("Invalid or corrupted invite link.", true); return; }
    try {
      await pc.setRemoteDescription(offer);
      await pc.setLocalDescription(await pc.createAnswer());
      await waitForIce();
      warnIfNoPublicCandidate();
      // Show the answer blob for the user to send back to the initiator.
      document.getElementById("answer-output").value = encode(pc.localDescription);
    } catch (err) {
      setStatus("Failed to answer the invite: " + err.message, true);
    }
  })();
}

// Send a chat message over the direct peer-to-peer channel.
document.getElementById("send-btn").onclick = () => {
  const input = document.getElementById("msg-input");
  if (!input.value) return;
  // Refuse to send if the channel is not open yet or has closed.
  if (!chatChannel || chatChannel.readyState !== "open") { addLine("(cannot send — channel not open)"); return; }
  chatChannel.send(input.value);
  addLine("You: " + input.value);
  input.value = "";
};
</script>
</body>
</html>
